    <title>Passanger Booking form</title>

<body>
    <h1>Passanger Booking Form</h1>

    <form action="add_booking.php" method="POST">
    <table>
        <tr>
            <td>Passenger Name:</td>
            <td><input type="text" name="passenger_name" maxlength="100" required></td>
        </tr>
        <tr>
            <td>Destination:</td>
            <td><input type="text" name="destination" maxlength="100" required></td>
        </tr>
        <tr>
            <td>Fare:</td>
            <td><input type="number" name="fare" min="0.01" step="0.01" required></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="submit" value="Add Booking"></td>
        </tr>
    </table>
    </form>
